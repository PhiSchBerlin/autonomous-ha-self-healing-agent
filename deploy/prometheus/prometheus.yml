global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    instance: ha-self-healing-agent

scrape_configs:
  - job_name: ha_agent
    static_configs:
      - targets: ["agent:8765"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: chromadb
    static_configs:
      - targets: ["chromadb:8000"]
    metrics_path: /metrics
    scrape_interval: 60s
