[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-self-healing-agent"
version = "1.4.4"
description = "Autonomer Home Assistant Self-Healing & Security AI Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "openai>=1.56.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "chromadb>=0.5.0",
    "gitpython>=3.1.43",
    "prometheus-client>=0.21.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
websocket = [
    "websockets>=13.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
ha-agent = "main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "S",         # bandit (security)
    "B",         # bugbear
    "A",         # builtins
    "EM",        # errmsg
    "UP",        # pyupgrade
    "RUF",       # ruff-specific
]
ignore = ["S101", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "EM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
