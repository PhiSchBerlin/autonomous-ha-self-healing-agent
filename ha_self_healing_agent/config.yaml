name: "HA Self-Healing Agent"
description: >
  Autonomous AI agent for self-healing and security monitoring of Home Assistant.
  Analyzes logs, detects configuration errors and suggests repairs -
  always with human control.
version: "1.6.6"
slug: ha_self_healing_agent
url: "https://github.com/PhiSchBerlin/autonomous-ha-self-healing-agent"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

ports:
  8765/tcp: 8765
  8501/tcp: 8501
ports_description:
  8765/tcp: "Agent API (FastAPI)"
  8501/tcp: "Dashboard (Streamlit)"

ingress: true
ingress_port: 8501
ingress_stream: true

homeassistant_api: true
hassio_api: true
hassio_role: default

host_network: false
host_pid: false
apparmor: true


options:
  agent_mode: "advisory"
  llm_backend_type: "ollama"
  llm_model: "qwen2.5-coder:14b"
  llm_base_url: "http://192.168.178.200:11434"
  llm_fallback_base_url: "http://192.168.178.161:11434"
  llm_fallback_model: "qwen2.5-coder:7b"
  llm_cloud_enabled: false
  llm_anonymize_sensitive_data: true
  log_level: "INFO"
  approval_timeout_seconds: 3600
  allow_autonomous_file_writes: false
  dashboard_refresh_seconds: 30
  llm_fallback_first_token_timeout_seconds: 0

schema:
  agent_mode: "list(advisory|approval|autonomous)"
  llm_backend_type: "list(ollama|lm_studio|vllm|local_ai|tabby_api|llama_cpp|anthropic|openai|gemini|openrouter)"
  llm_model: str
  llm_base_url: url
  llm_fallback_base_url: url?
  llm_fallback_model: str?
  llm_cloud_enabled: bool
  llm_anonymize_sensitive_data: bool
  llm_api_key: str?
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  approval_timeout_seconds: int(60,86400)
  allow_autonomous_file_writes: bool
  dashboard_refresh_seconds: int(10,300)
  llm_fallback_first_token_timeout_seconds: int(0,300)

map:
  - config:rw
  - data:rw
